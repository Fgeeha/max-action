name: CI

on:
  push:
    branches: [Master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./cmd/max-action

      - name: Verify the working tree is clean
        run: |
          rm -f coverage.out max-action
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the working tree changed during the build:"
            git status --porcelain
            git diff
            exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: max-action:ci

      # A configuration error exits non-zero without any network call, which
      # proves the entrypoint and image wiring work. No message is sent.
      - name: Smoke test the entrypoint
        run: |
          output="$(docker run --rm \
            -e INPUT_TOKEN=dummy-token \
            max-action:ci 2>&1)" && status=0 || status=$?

          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::the action should fail when no recipient is given"
            exit 1
          fi
          case "$output" in
            *"exactly one of chat_id or user_id"*) ;;
            *) echo "::error::unexpected failure message"; exit 1 ;;
          esac
          # The ::add-mask:: line necessarily carries the token, since that is
          # how the runner learns to redact it. Nothing else may.
          if printf '%s\n' "$output" | grep -v '^::add-mask::' | grep -q 'dummy-token'; then
            echo "::error::the token appeared outside the add-mask command"
            exit 1
          fi

  action:
    name: Action metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Running the action against a local stub verifies action.yml, the Docker
      # build and the outputs without touching the real MAX API.
      - name: Start a stub MAX API
        run: |
          cat > stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  body = b'{"message":{"body":{"mid":"stub-mid"}}}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass

          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          python3 stub.py &
          for _ in $(seq 1 20); do
            curl -fsS -X POST http://127.0.0.1:8080/messages >/dev/null 2>&1 && break
            sleep 0.5
          done

      - name: Run the action
        id: notify
        uses: ./
        with:
          token: stub-token
          chat_id: "12345"
          message: CI stub run
          api_base_url: http://172.17.0.1:8080
          debug: "true"

      - name: Check outputs
        run: |
          test "${{ steps.notify.outputs.message_id }}" = "stub-mid"
          test "${{ steps.notify.outputs.recipient_type }}" = "chat"
          test "${{ steps.notify.outputs.recipient_id }}" = "12345"
