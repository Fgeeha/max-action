# Publishes a release for an existing vX.Y.Z tag: the runtime image goes to
# GHCR first, then the vX major tag moves and the GitHub release appears. The
# tag is created by hand, so no release ever happens without an explicit
# decision.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/fgeeha/max-action

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Consumers resolve the image from action.yml, so a stale pin there would
      # silently ship the previous release under a new tag.
      - name: Verify action.yml pins the image being released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="  image: docker://${IMAGE}:${TAG}"
          if ! grep -qxF "$expected" action.yml; then
            echo "::error::action.yml must pin ${IMAGE}:${TAG} before tagging; found:"
            grep -n 'image:' action.yml
            exit 1
          fi

  publish:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/attestations require the docker-container driver; the
      # default `docker` driver rejects them outright.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # VERSION only reaches the binary here: GitHub cannot pass build args to
      # an inline `image: Dockerfile` action, so this is where the User-Agent
      # stops saying "dev".
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true

  release:
    name: Publish release
    needs: publish
    runs-on: ubuntu-latest
    # Records each published version under Deployments, next to live-test.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    # Releases move the major tag one at a time. Runs queue rather than cancel
    # each other, though GitHub keeps only one pending run per group.
    concurrency:
      group: release-major-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Moved only after the image exists, so @v1 never resolves to an action
      # whose image cannot be pulled. Only the highest vX.Y.Z of the major may
      # move it: re-running an old release, or two releases finishing in
      # reverse order, then leaves the tag alone instead of rolling it back.
      # Every run compares against the full tag list, which already holds every
      # release, so the result does not depend on which run finishes first.
      # If the newest release fails before this step, the tag stays on the
      # last good one until that release is fixed and re-run.
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          latest=$(git ls-remote --tags --refs origin "refs/tags/${major}.*" \
            | sed 's|.*refs/tags/||' \
            | grep -E "^${major}\.[0-9]+\.[0-9]+$" \
            | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "::error::cannot list ${major}.x.y tags on origin"
            exit 1
          fi
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest $major release ($latest), leaving $major unchanged"
            exit 0
          fi
          git tag -f "$major" "$TAG"
          git push origin -f "refs/tags/$major"

      # Publishing a release through the GitHub UI creates the tag, which
      # triggers this workflow, so the release may already exist by the time we
      # get here. Hand-written release notes are left untouched.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists, keeping it as published"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
